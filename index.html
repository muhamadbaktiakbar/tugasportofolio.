        /* --- RESET & VARIABLES --- */
        :root {
            --bg-color: #0f172a;       /* Dark Blue Slate */
            --card-bg: #1e293b;        /* Lighter Slate */
            --text-main: #e2e8f0;      /* White-ish */
            --text-muted: #94a3b8;     /* Grey */
            --accent: #38bdf8;         /* Cyan/Sky Blue */
            --terminal-green: #4ade80; /* Green for success/status */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        a { text-decoration: none; color: inherit; transition: 0.3s; }
        ul { list-style: none; }

        /* --- UTILITIES --- */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 3rem;
            text-align: center;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background: var(--accent);
            margin: 10px auto 0;
            border-radius: 2px;
        }

        .mono {
            font-family: 'Fira Code', monospace;
            color: var(--accent);
        }
